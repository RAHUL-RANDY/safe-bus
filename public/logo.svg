<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Glow Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="70%" stop-color="#2563eb" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <!-- Shield Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Bus Body Gradient -->
    <linearGradient id="busGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#93c5fd" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Windshield Cyan Gradient -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.7" />
    </linearGradient>

    <!-- Hologram Gold / Amber Accent -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Drop Shadow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Glow Background -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGlow)" />

  <!-- Outer Orbital Radar Track -->
  <circle cx="256" cy="256" r="230" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="2" stroke-dasharray="8 8" />
  <circle cx="256" cy="256" r="200" stroke="#2563eb" stroke-opacity="0.3" stroke-width="1.5" />

  <!-- Orbiting Satellites / Sensor Nodes -->
  <circle cx="398" cy="114" r="6" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="114" cy="398" r="5" fill="#a855f7" />
  <circle cx="456" cy="256" r="4" fill="#60a5fa" />

  <!-- Safety Shield Base Container -->
  <path
    d="M256 46C150 78 80 120 80 230C80 345 180 435 256 470C332 435 432 345 432 230C432 120 362 78 256 46Z"
    fill="#0f172a"
    stroke="url(#shieldGrad)"
    stroke-width="14"
    stroke-linejoin="round"
  />

  <!-- Inner High-Tech Shield Border -->
  <path
    d="M256 68C165 96 104 134 104 230C104 328 190 408 256 438C322 408 408 328 408 230C408 134 347 96 256 68Z"
    fill="#090d16"
    stroke="#1e293b"
    stroke-width="4"
  />

  <!-- Aerodynamic Smart Bus Silhouette -->
  <!-- Main Chassis -->
  <rect x="156" y="150" width="200" height="210" rx="36" fill="url(#busGrad)" />

  <!-- Front Aerodynamic Windshield Glass -->
  <rect x="176" y="168" width="160" height="74" rx="18" fill="url(#glassGrad)" stroke="#38bdf8" stroke-width="2.5" />
  <!-- Windshield Reflection -->
  <path d="M190 176 L230 176 L205 234 L180 234 Z" fill="#ffffff" fill-opacity="0.35" />

  <!-- Destination Matrix LED Route Sign -->
  <rect x="196" y="154" width="120" height="10" rx="4" fill="#090d16" stroke="#38bdf8" stroke-width="1" />
  <circle cx="210" cy="159" r="2" fill="#38bdf8" />
  <circle cx="218" cy="159" r="2" fill="#38bdf8" />
  <circle cx="226" cy="159" r="2" fill="#38bdf8" />
  <circle cx="234" cy="159" r="2" fill="#38bdf8" />
  <circle cx="278" cy="159" r="2" fill="#22c55e" />
  <circle cx="286" cy="159" r="2" fill="#22c55e" />
  <circle cx="294" cy="159" r="2" fill="#22c55e" />
  <circle cx="302" cy="159" r="2" fill="#22c55e" />

  <!-- Cabin Windows (4 Matrix Sections) -->
  <rect x="176" y="254" width="34" height="42" rx="8" fill="#0f172a" stroke="#60a5fa" stroke-width="2" />
  <rect x="218" y="254" width="34" height="42" rx="8" fill="#0f172a" stroke="#60a5fa" stroke-width="2" />
  <rect x="260" y="254" width="34" height="42" rx="8" fill="#0f172a" stroke="#60a5fa" stroke-width="2" />
  <rect x="302" y="254" width="34" height="42" rx="8" fill="#0f172a" stroke="#60a5fa" stroke-width="2" />

  <!-- Smart Cyber Headlights / Laser Matrix -->
  <rect x="168" y="316" width="36" height="14" rx="6" fill="#38bdf8" filter="url(#glow)" />
  <rect x="308" y="316" width="36" height="14" rx="6" fill="#38bdf8" filter="url(#glow)" />

  <!-- Central Grille / AI Telemetry Sensor Array -->
  <rect x="216" y="316" width="80" height="14" rx="6" fill="#090d16" stroke="#2563eb" stroke-width="2" />
  <circle cx="256" cy="323" r="4" fill="#38bdf8" />

  <!-- Front Pneumatic Wheels / Kinetic Hubs -->
  <rect x="146" y="310" width="16" height="46" rx="6" fill="#0f172a" stroke="#475569" stroke-width="2" />
  <rect x="350" y="310" width="16" height="46" rx="6" fill="#0f172a" stroke="#475569" stroke-width="2" />

  <!-- Dynamic Center Safety Emblem & AI Core -->
  <g transform="translate(256, 395)">
    <!-- Radiating Pulsar Ring -->
    <circle cx="0" cy="0" r="28" fill="#090d16" stroke="url(#shieldGrad)" stroke-width="4" />
    <circle cx="0" cy="0" r="20" fill="#2563eb" fill-opacity="0.2" stroke="#38bdf8" stroke-width="2" />
    
    <!-- Central Protection Star / AI Spark -->
    <path
      d="M0 -12 L3 -3 L12 0 L3 3 L0 12 L-3 3 L-12 0 L-3 -3 Z"
      fill="#ffffff"
      filter="url(#glow)"
    />
  </g>
</svg>
